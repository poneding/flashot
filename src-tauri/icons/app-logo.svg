<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 24 24" role="img" aria-label="Flashot app logo">
  <defs>
    <path id="tileShape" d="M6.5 0h11C22.3 0 24 1.7 24 6.5v11c0 4.8-1.7 6.5-6.5 6.5h-11C1.7 24 0 22.3 0 17.5v-11C0 1.7 1.7 0 6.5 0Z"/>
    <clipPath id="tileClip">
      <use xlink:href="#tileShape"/>
    </clipPath>
    <linearGradient id="tileEdge" x1="3" y1="0" x2="20" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c2d8ed" stop-opacity="0.62"/>
      <stop offset="0.32" stop-color="#c2d8ed" stop-opacity="0.18"/>
      <stop offset="0.68" stop-color="#c2d8ed" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c2d8ed" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tileFace" x1="5" y1="0" x2="18" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#324b6a"/>
      <stop offset="0.38" stop-color="#1e314b"/>
      <stop offset="0.76" stop-color="#101d31"/>
      <stop offset="1" stop-color="#1b2d47"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="3" cy="1" r="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#afcfec" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#8eb5db" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8eb5db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanSide" x1="4" y1="3" x2="20" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a0b5ce"/>
      <stop offset="1" stop-color="#71859e"/>
    </linearGradient>
    <linearGradient id="scanFace" x1="5" y1="3" x2="18" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#edf5fc"/>
      <stop offset="1" stop-color="#c6d6e9"/>
    </linearGradient>
    <linearGradient id="scanLight" x1="4" y1="3" x2="18" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0f7ff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="0.4" stdDeviation="0.48" flood-color="#050b16" flood-opacity="0.28"/>
    </filter>
    <filter id="scanShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0.08" dy="0.35" stdDeviation="0.22" flood-color="#020916" flood-opacity="0.52"/>
    </filter>
    <pattern id="surfaceGrain" width="0.9" height="0.9" patternUnits="userSpaceOnUse">
      <image width="0.9" height="0.9" xlink:href="data:image/png;base64,"/>
    </pattern>
    <!-- Preserve the original flash material, including its highlights and shadow. -->
    <linearGradient id="flashGold" x1="6" y1="2" x2="18" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbc9" />
      <stop offset="0.28" stop-color="#ffdc62" />
      <stop offset="0.58" stop-color="#ffad24" />
      <stop offset="0.82" stop-color="#e57510" />
      <stop offset="1" stop-color="#923906" />
    </linearGradient>
<linearGradient id="softGoldSheen" x1="5" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3a8" stop-opacity="0.5" />
      <stop offset="0.35" stop-color="#ffe071" stop-opacity="0.36" />
      <stop offset="0.68" stop-color="#ffc13c" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ff9a1f" stop-opacity="0" />
    </linearGradient>
<linearGradient id="warmGoldDepth" x1="9" y1="7" x2="18" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffce4c" stop-opacity="0" />
      <stop offset="0.45" stop-color="#e88918" stop-opacity="0.18" />
      <stop offset="0.82" stop-color="#9f4309" stop-opacity="0.32" />
      <stop offset="1" stop-color="#5a1c04" stop-opacity="0.16" />
    </linearGradient>
<filter id="flashDepth" x="-32%" y="-32%" width="164%" height="164%">
      <feDropShadow dx="0.34" dy="0.9" stdDeviation="0.55" flood-color="#000000" flood-opacity="0.43" />
      <feDropShadow dx="-0.16" dy="-0.28" stdDeviation="0.24" flood-color="#fff0a0" flood-opacity="0.42" />
    </filter>
  </defs>

  <g id="appIconTile" transform="translate(1.92 1.92) scale(0.84)">
    <!-- Keep the gradient face outside the shadow filter to avoid color banding. -->
    <use xlink:href="#tileShape" fill="#101d31" filter="url(#tileShadow)"/>
    <use xlink:href="#tileShape" fill="url(#tileFace)"/>
    <use xlink:href="#tileShape" fill="url(#tileLight)"/>
    <use xlink:href="#tileShape" fill="url(#surfaceGrain)" opacity="0.4"/>
    <g clip-path="url(#tileClip)">
      <use xlink:href="#tileShape" fill="none" stroke="url(#tileEdge)" stroke-width="0.34"/>
    </g>

    <!-- Keep both original transforms so the flash retains its exact size and position. -->
    <g id="foregroundMark" transform="translate(1.44 1.44) scale(0.88)">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(0 0.22)" stroke="url(#scanSide)" stroke-width="2.12" filter="url(#scanShadow)">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        </g>
        <g stroke="url(#scanFace)" stroke-width="2.08">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        </g>
        <g transform="translate(-0.08 -0.1)" stroke="url(#scanLight)" stroke-width="1.68">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        </g>
      </g>

      <path transform="translate(0.38 0.52)" fill="#02040a" opacity="0.54" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
<path filter="url(#flashDepth)" fill="url(#flashGold)" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
<path fill="url(#softGoldSheen)" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
<path fill="url(#warmGoldDepth)" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
    </g>
  </g>
</svg>
